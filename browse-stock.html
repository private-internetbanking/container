<!DOCTYPE html>
<html lang="en">
  <head>

    <title>SteelBox | Browse Stock</title>
    <style>
      :root {
        --bg: #090f15;
        --bg-alt: #101b27;
        --panel: rgba(16, 24, 33, 0.92);
        --panel-soft: rgba(255, 255, 255, 0.03);
        --panel-strong: #0a1117;
        --gold: #d6ad64;
        --gold-soft: #f1d7a0;
        --primary: #5b8df6;
        --primary-strong: #2b6eea;
        --steel: #edf5ff;
        --muted: #a7b6c9;
        --line: rgba(255, 255, 255, 0.08);
        --success: #73d8b3;
        --warning: #ffca7b;
        --shadow: 0 28px 65px rgba(3, 7, 12, 0.52);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--steel);
        background:
          radial-gradient(circle at top left, rgba(91, 141, 246, 0.24), transparent 18%),
          radial-gradient(circle at bottom right, rgba(214, 173, 100, 0.14), transparent 18%),
          linear-gradient(180deg, #070d13 0%, #0a141d 26%, #0d1a27 100%);
      }
      a { text-decoration: none; }
      button, input, textarea, select { font: inherit; }
      .container { width: min(1200px, calc(100% - 32px)); margin: 0 auto; }
      .topbar { padding: 22px 0 10px; }
      .nav {
        display: flex; align-items: center; justify-content: space-between; gap: 18px;
        background: rgba(7, 13, 18, 0.7);
        border: 1px solid var(--line);
        border-radius: 20px; padding: 14px 18px; box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: 0.05em; color: var(--steel); }
      .brand-mark {
        width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px;
        background: linear-gradient(135deg, var(--gold), #f0c77c); color: #121b27; font-weight: 900;
        box-shadow: 0 12px 20px rgba(214, 173, 100, 0.25);
      }
      .nav-links { display: flex; gap: 24px; align-items: center; }
      .nav-links a { color: var(--muted); font-weight: 600; }
      .nav-links a:hover { color: var(--steel); }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        padding: 12px 20px; border: 1px solid transparent; border-radius: 12px;
        font-weight: 700; cursor: pointer; transition: all 0.2s ease;
      }
      .btn:hover { transform: translateY(-2px); }
      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: white; box-shadow: 0 18px 32px rgba(43,110,234,0.35);
      }
      .btn-secondary {
        background: rgba(255,255,255,0.03); border-color: var(--line); color: var(--steel);
      }
      .cart-button {
        position: relative; padding-inline: 18px; min-width: 140px;
      }
      .cart-count {
        position: absolute; top: -8px; right: -6px; min-width: 22px; height: 22px;
        display: grid; place-items: center; border-radius: 50%; background: var(--gold);
        color: #142534; font-size: 0.7rem; font-weight: 900;
      }
      .page-head { padding: 36px 0 10px; }
      .page-head h1 {
        margin: 14px 0 12px; font-size: clamp(2.4rem, 4vw, 4.3rem);
        letter-spacing: -0.05em; color: #f4f9ff;
      }
      .crumb { color: var(--muted); font-size: 0.9rem; }
      .section { padding: 28px 0 80px; }
      .toolbar {
        display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 18px; align-items: center;
        margin-bottom: 30px;
      }
      .filter-row {
        display: flex; gap: 12px; flex-wrap: wrap; padding: 14px 16px;
        background: rgba(10, 17, 23, 0.82); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
      }
      .chip {
        appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.02);
        color: var(--muted); border-radius: 999px; padding: 10px 14px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
      }
      .chip.active {
        background: linear-gradient(135deg, rgba(91,141,246,0.16), rgba(214,173,100,0.08));
        border-color: rgba(91, 141, 246, 0.32); color: var(--steel);
      }
      .search-panel {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 12px 16px; border: 1px solid var(--line); border-radius: 18px;
        background: rgba(10,17,23,0.82); box-shadow: var(--shadow);
      }
      .search-panel input {
        width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
        background: rgba(255,255,255,0.025); color: var(--steel);
      }
      .stock-tag {
        display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
        color: var(--muted); font-weight: 700; font-size: 0.82rem; letter-spacing: 0.04em; text-transform: uppercase;
      }
      .stock-dot {
        width: 10px; height: 10px; border-radius: 50%; background: var(--success);
        box-shadow: 0 0 0 6px rgba(115,216,179,0.12);
      }
      .catalog-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
      .product-card {
        position: relative; overflow: hidden; background: rgba(11, 17, 23, 0.9);
        border: 1px solid var(--line); border-radius: 24px; padding: 18px; box-shadow: var(--shadow);
      }
      .product-card::before {
        content: ""; position: absolute; inset: 0 auto auto 0; width: 100%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(214,173,100,0.6), transparent);
      }
      .badge {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 7px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
      }
      .badge-stock { background: rgba(115,216,179,0.12); color: var(--success); }
      .badge-new { background: rgba(91,141,246,0.12); color: #dfeaff; }
      .badge-rare { background: rgba(214,173,100,0.12); color: var(--gold-soft); }
      .product-visual {
        height: 190px; margin: 18px 0 16px; border-radius: 18px;
        background: linear-gradient(135deg, rgba(91,141,246,0.14), rgba(214,173,100,0.08), rgba(255,255,255,0.02));
        border: 1px solid var(--line); display: grid; place-items: center; position: relative; overflow: hidden;
      }
      .product-visual::after {
        content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%;
        background: rgba(255,255,255,0.03); bottom: -35px; right: -15px;
      }
      .product-thumb {
        width: 150px; height: 100px; object-fit: cover; display: block; border-radius: 8px;
        box-shadow: 0 12px 24px rgba(10, 17, 23, 0.3);
      }
      .mini-box {
        width: 66%; height: 88px; border-radius: 14px; background: linear-gradient(135deg, #dfeaf8, #b4c7e3);
        position: relative; box-shadow: inset 0 0 0 8px rgba(12, 24, 35, 0.82);
        transform: perspective(500px) rotateX(5deg);
      }
      .mini-box::before { content: ""; position: absolute; inset: 12px; border: 2px solid rgba(12,24,35,0.45); border-radius: 8px; }
      .product-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
      .product-meta h3 { margin: 0; font-size: 1.35rem; color: #edf6ff; }
      .price-tag { font-size: 1.55rem; font-weight: 800; color: var(--gold-soft); }
      .product-card p { color: var(--muted); line-height: 1.7; margin: 10px 0 18px; }
      .specs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
      .specs span {
        background: rgba(255,255,255,0.04); color: var(--steel); border: 1px solid var(--line);
        border-radius: 999px; padding: 7px 10px; font-size: 0.76rem; font-weight: 700;
      }
      .product-card .btn { width: 100%; }
      .empty-state {
        grid-column: 1 / -1; padding: 32px; text-align: center; border: 1px dashed var(--line);
        border-radius: 18px; color: var(--muted); background: rgba(255,255,255,0.015);
      }
      .cart-drawer {
        position: fixed; top: 0; right: 0; width: min(420px, 100%); height: 100vh;
        background: rgba(10, 17, 23, 0.98); border-left: 1px solid var(--line);
        box-shadow: var(--shadow); transform: translateX(110%); transition: transform 0.28s ease; z-index: 50; display: flex; flex-direction: column;
      }
      .cart-drawer.open { transform: translateX(0); }
      .drawer-header, .drawer-footer {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 20px 22px; border-bottom: 1px solid var(--line);
      }
      .drawer-header h3, .drawer-footer h4 { margin: 0; color: var(--steel); }
      .close-btn {
        border: 1px solid var(--line); background: transparent; color: var(--steel);
        width: 38px; height: 38px; border-radius: 12px; cursor: pointer;
      }
      .cart-items { padding: 18px 22px; flex: 1; overflow-y: auto; display: grid; gap: 16px; }
      .cart-item {
        display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 14px 14px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,0.02);
      }
      .cart-item strong { display: block; margin-bottom: 6px; }
      .cart-item p { margin: 0; color: var(--muted); font-size: 0.92rem; }
      .cart-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      .qty-btn {
        width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,0.02); color: var(--steel); cursor: pointer;
      }
      .cart-summary { display: grid; gap: 10px; }
      .line-total { display: flex; justify-content: space-between; color: var(--muted); }
      .line-total strong { color: var(--steel); }
      .drawer-footer { border-top: 1px solid var(--line); border-bottom: 0; display: grid; gap: 12px; }
      .empty-cart { color: var(--muted); text-align: center; padding: 12px; }
      .checkout-modal {
        position: fixed; inset: 0; background: rgba(2, 6, 10, 0.72); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 60;
      }
      .checkout-modal.open { display: flex; }
      .checkout-panel {
        width: min(720px, 100%); background: rgba(11, 17, 23, 0.98); border: 1px solid var(--line);
        border-radius: 26px; padding: 28px; box-shadow: var(--shadow);
      }
      .checkout-header { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 20px; }
      .checkout-header h3 { margin: 0; font-size: clamp(1.8rem, 2vw, 2.3rem); }
      .checkout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .checkout-form { display: grid; gap: 16px; }
      label { display: grid; gap: 8px; color: var(--steel); font-weight: 700; }
      input, select, textarea {
        width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; background: rgba(255,255,255,0.02); color: var(--steel);
      }
      textarea { min-height: 120px; resize: vertical; }
      .summary-box {
        background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
      }
      .summary-item { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; color: var(--muted); }
      .summary-item strong { color: var(--steel); }
      .success-toast {
        position: fixed; right: 22px; bottom: 22px; background: rgba(115,216,179,0.12);
        border: 1px solid rgba(115,216,179,0.4); color: #dffef3; border-radius: 12px; padding: 12px 16px;
        box-shadow: var(--shadow); opacity: 0; transform: translateY(20px); transition: all 0.2s ease; z-index: 80; pointer-events: none;
      }
      .success-toast.visible { opacity: 1; transform: translateY(0); }
      .product-detail-modal {
        position: fixed; inset: 0; background: rgba(4, 8, 12, 0.78); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 70;
      }
      .product-detail-modal.open { display: flex; }
      .product-detail-panel {
        width: min(560px, 100%); background: rgba(11, 17, 23, 0.98); border: 1px solid var(--line); border-radius: 28px;
        padding: 22px; box-shadow: var(--shadow); position: relative; animation: panelRise 0.25s ease;
      }
      @keyframes panelRise {
        from { opacity: 0; transform: translateY(18px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .detail-close {
        position: absolute; top: 18px; right: 18px; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--steel); cursor: pointer;
      }
      .product-detail-visual {
        height: 170px; border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(135deg, rgba(91,141,246,0.14), rgba(214,173,100,0.09));
        display: grid; place-items: center; margin-bottom: 16px;
      }
      .product-modal-badge {
        display: inline-block; margin-bottom: 10px; padding: 7px 10px; border: 1px solid rgba(214,173,100,0.4); border-radius: 999px; background: rgba(214,173,100,0.1); color: var(--gold-soft); font-weight: 800; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase;
      }
      .product-detail-panel h3 { margin: 0 0 12px; font-size: clamp(1.8rem, 2vw, 2.4rem); }
      .detail-price-row {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px;
      }
      .detail-price { font-size: 1.8rem; color: var(--gold-soft); font-weight: 800; }
      .detail-size { color: var(--muted); font-weight: 700; }
      .product-detail-panel p { color: var(--muted); line-height: 1.7; margin: 0 0 18px; }
      .detail-specs { margin-bottom: 20px; }
      .product-card, .chip, .btn, .cart-drawer, .checkout-panel, .product-detail-panel {
        animation: floatIn 0.45s ease;
      }
      @keyframes floatIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      footer { background: rgba(8, 12, 17, 0.92); color: rgba(255,255,255,0.8); padding: 28px 0 60px; border-top: 1px solid var(--line); }
      .footer-wrap { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: center; }
      .footer-links { display: flex; gap: 22px; flex-wrap: wrap; }
      .footer-links a { color: rgba(255,255,255,0.7); }
      @media (max-width: 920px) {
        .toolbar { grid-template-columns: 1fr; }
        .catalog-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
        .checkout-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 680px) {
        .nav { flex-wrap: wrap; justify-content: center; }
        .nav-links { flex-wrap: wrap; justify-content: center; }
        .catalog-grid { grid-template-columns: 1fr; }
        .cart-button { width: 100%; }
      }
    </style>
  </head>

        { id: 'high-cube', name: 'High Cube', category: 'high-cube', size: '40ft', price: 4250, badge: 'Premium', description: 'Extra headroom for workshops, storage conversion, and custom builds.', tags: ['Extra height', 'Custom fit'], detail: 'Adds crucial vertical room for equipment storage, workspace conversion, and premium custom fit-outs without sacrificing strength.' },
        { id: 'open-side', name: 'Open Side', category: 'open-side', size: '20ft', price: 4900, badge: 'Rare', description: 'Fast-access loading ideal for equipment yards and warehousing.', tags: ['Quick access', 'Flexible use'], detail: 'The open-side configuration makes loading, unloading, and daily access simple for machinery, tools, and high-turnover stock rooms.' },
        { id: 'reefer', name: 'Reefer Unit', category: 'reefer', size: '40ft', price: 6400, badge: 'Cold chain', description: 'Temperature controlled shipping container for chilled inventory.', tags: ['Insulated', '4°C to 7°C'], detail: 'Precision-controlled cold storage for sensitive inventory, food handling, and export operations requiring reliable temperature stability.' },
        { id: 'office', name: 'Office Unit', category: 'office', size: '20ft', price: 5900, badge: 'Custom', description: 'Modular, wired, and ready for operational offices or site hubs.', tags: ['Office fit', 'Modular'], detail: 'A polished site office solution with ready-to-use internal layout, insulation, and durable industrial finish for field operations.' }
      ];

      const STORAGE_KEY = 'steelbox-cart-v1';
      const state = {
        filter: 'all',
        search: '',
        cart: readCart()
      };

      const catalogGrid = document.getElementById('catalogGrid');
      const cartItems = document.getElementById('cartItems');
      const cartCount = document.getElementById('cartCount');
      const subtotalValue = document.getElementById('subtotalValue');
      const shippingValue = document.getElementById('shippingValue');
      const totalValue = document.getElementById('totalValue');
      const checkoutSummary = document.getElementById('checkoutSummary');
      const checkoutForm = document.getElementById('checkoutForm');
      const successToast = document.getElementById('successToast');
      const cartDrawer = document.getElementById('cartDrawer');
      const checkoutModal = document.getElementById('checkoutModal');
      const productModal = document.getElementById('productDetailModal');
      const modalContent = document.getElementById('productDetailContent');

      function readCart() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : [];
        } catch (error) {
          return [];
        }
      }

      function saveCart() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.cart));
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(value);
      }

      function getProductById(productId) {
        return products.find((product) => product.id === productId);
      }

      function getCartTotals() {
        const subtotal = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        const shipping = state.cart.length ? 280 : 0;
        const total = subtotal + shipping;
        return { subtotal, shipping, total };
      }

      function renderCatalog() {
        const filteredProducts = products.filter((product) => {
          const matchesFilter = state.filter === 'all' || product.category === state.filter;
          const keyword = state.search.trim().toLowerCase();
          const matchesSearch = !keyword || product.name.toLowerCase().includes(keyword) || product.description.toLowerCase().includes(keyword) || product.tags.join(' ').toLowerCase().includes(keyword);
          return matchesFilter && matchesSearch;
        });

        if (!filteredProducts.length) {
          catalogGrid.innerHTML = '<div class="empty-state">No containers match your current filter. Try a different size or search term.</div>';
          return;
        }

        catalogGrid.innerHTML = filteredProducts.map((product) => `
          <article class="product-card">
            <span class="badge ${product.badge === 'Best seller' ? 'badge-new' : product.badge === 'Premium' ? 'badge-rare' : 'badge-stock'}">${product.badge}</span>
            <div class="product-visual">
              ${product.id === '20-standard'
                ? '<img src="20ft container.jpg" alt="20ft Standard container" class="product-thumb" />'
                : product.id === '40-standard'
                  ? '<img src="40ft container.jpg" alt="40ft Standard container" class="product-thumb" />'
                  : product.id === 'high-cube'
                    ? '<img src="40ft high cube.jpg" alt="High Cube container" class="product-thumb" />'
                    : product.id === 'reefer'
                      ? '<img src="40ft reefer containers.jpg" alt="Reefer Unit container" class="product-thumb" />'
                      : product.id === 'office'
                        ? '<img src="20ft office unit.jpg" alt="Office Unit container" class="product-thumb" />'
                        : product.id === 'open-side'
                          ? '<img src="20ft open sided container.jpg" alt="Open Side container" class="product-thumb" />'
                          : `<div class="mini-box" style="width: ${product.size === '20ft' ? '66%' : '76%'};"></div>`}
            </div>
            <div class="product-meta">
              <h3>${product.name}</h3>
              <span class="price-tag">${formatCurrency(product.price)}</span>
            </div>
            <p>${product.description}</p>
            <div class="specs">
              <span>${product.size}</span>
              ${product.tags.map((tag) => `<span>${tag}</span>`).join('')}
            </div>
            <div class="action-row" style="display:flex;gap:10px;">
              <button type="button" class="btn btn-secondary detail-button" data-id="${product.id}" style="width:48%;">View details</button>
              <button type="button" class="btn btn-primary add-to-cart" data-id="${product.id}" style="width:52%;">Add to cart</button>
            </div>
          </article>
        `).join('');
      }

      function updateCart() {
        const { subtotal, shipping, total } = getCartTotals();
        cartCount.textContent = state.cart.reduce((sum, item) => sum + item.qty, 0);
        subtotalValue.textContent = formatCurrency(subtotal);
        shippingValue.textContent = formatCurrency(shipping);
        totalValue.textContent = formatCurrency(total);

        if (!state.cart.length) {
          cartItems.innerHTML = '<div class="empty-cart">No containers selected yet.</div>';
          checkoutSummary.innerHTML = '<p class="empty-cart">Add stock to create an order.</p>';
          return;
        }

        cartItems.innerHTML = state.cart.map((item) => `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong>
              <p>${item.size}</p>
              <p>${formatCurrency(item.price)} each</p>
              <div class="cart-controls">
                <button type="button" class="qty-btn" data-action="decrease" data-id="${item.id}">−</button>
                <span>${item.qty}</span>
                <button type="button" class="qty-btn" data-action="increase" data-id="${item.id}">+</button>
              </div>
            </div>
            <div style="text-align:right;">
              <strong>${formatCurrency(item.price * item.qty)}</strong>
              <div style="margin-top: 12px;">
                <button type="button" class="btn btn-secondary" data-action="remove" data-id="${item.id}" style="padding: 8px 12px; font-size: 0.76rem;">Remove</button>
              </div>
            </div>
          </div>
        `).join('');

        checkoutSummary.innerHTML = state.cart.map((item) => `
          <div class="summary-item">
            <span>${item.name} x ${item.qty}</span>
            <strong>${formatCurrency(item.price * item.qty)}</strong>
          </div>
        `).join('') + `
          <div class="summary-item" style="margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px;">
            <span>Delivery</span>
            <strong>${formatCurrency(shipping)}</strong>
          </div>
          <div class="summary-item">
            <span>Total</span>
            <strong>${formatCurrency(total)}</strong>
          </div>
        `;
      }

      function showToast(message) {
        successToast.textContent = message;
        successToast.classList.add('visible');
        clearTimeout(showToast.timeoutId);
        showToast.timeoutId = setTimeout(() => successToast.classList.remove('visible'), 1800);
      }

      function openProductDetail(productId) {
        const product = getProductById(productId);
        if (!product) return;

        modalContent.innerHTML = `
          <div class="product-detail-visual">
            <div class="mini-box" style="width:${product.size === '20ft' ? '64%' : '76%'}; height:96px;"></div>
          </div>
          <span class="product-modal-badge">${product.badge}</span>
          <h3>${product.name}</h3>
          <div class="detail-price-row">
            <span class="detail-price">${formatCurrency(product.price)}</span>
            <span class="detail-size">${product.size}</span>
          </div>
          <p>${product.detail}</p>
          <div class="specs detail-specs">
            ${product.tags.map((tag) => `<span>${tag}</span>`).join('')}
          </div>
          <button type="button" class="btn btn-primary add-to-cart" data-id="${product.id}">Add to cart</button>
        `;
        productModal.classList.add('open');
      }

      function closeProductDetail() {
        productModal.classList.remove('open');
      }

      function addToCart(productId) {
        const product = getProductById(productId);
        if (!product) return;

        const existingItem = state.cart.find((item) => item.id === productId);
        if (existingItem) {
          existingItem.qty += 1;
        } else {
          state.cart.push({ ...product, qty: 1 });
        }

        saveCart();
        updateCart();
        cartDrawer.classList.add('open');
        showToast(`${product.name} added to cart.`);
      }

      function adjustCartItem(productId, action) {
        const item = state.cart.find((entry) => entry.id === productId);
        if (!item) return;

        if (action === 'increase') item.qty += 1;
        if (action === 'decrease') item.qty -= 1;
        if (action === 'remove' || item.qty <= 0) {
          state.cart = state.cart.filter((entry) => entry.id !== productId);
        }

        saveCart();
        updateCart();
      }

      document.addEventListener('click', (event) => {
        const detailButton = event.target.closest('.detail-button');
        if (detailButton) {
          openProductDetail(detailButton.dataset.id);
          return;
        }

        const addButton = event.target.closest('.add-to-cart');
        if (addButton) {
          addToCart(addButton.dataset.id);
          return;
        }

        const qtyButton = event.target.closest('.qty-btn');
        if (qtyButton) {
          adjustCartItem(qtyButton.dataset.id, qtyButton.dataset.action);
          return;
        }

        const removeButton = event.target.closest('[data-action="remove"]');
        if (removeButton) {
          adjustCartItem(removeButton.dataset.id, 'remove');
        }

        if (event.target.classList.contains('product-detail-modal')) {
          closeProductDetail();
        }
      });

      document.querySelectorAll('.chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach((button) => button.classList.remove('active'));
          chip.classList.add('active');
          state.filter = chip.dataset.filter;
          renderCatalog();
        });
      });

      document.getElementById('quickSearch').addEventListener('input', (event) => {
        state.search = event.target.value;
        renderCatalog();
      });

      document.getElementById('openCartButton').addEventListener('click', () => cartDrawer.classList.add('open'));
      document.getElementById('closeCartButton').addEventListener('click', () => cartDrawer.classList.remove('open'));
      document.getElementById('checkoutButton').addEventListener('click', () => {
        if (!state.cart.length) {
          showToast('Your cart is empty.');
          return;
        }
        updateCart();
        checkoutModal.classList.add('open');
      });
      document.getElementById('closeCheckoutButton').addEventListener('click', () => checkoutModal.classList.remove('open'));
      checkoutModal.addEventListener('click', (event) => {
        if (event.target === checkoutModal) checkoutModal.classList.remove('open');
      });

      document.getElementById('productDetailClose').addEventListener('click', closeProductDetail);
      productModal.addEventListener('click', (event) => {
        if (event.target === productModal) closeProductDetail();
      });

      checkoutForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(checkoutForm);
        const customerName = formData.get('name') || 'Customer';
        const { total, shipping } = getCartTotals();
        const itemCount = state.cart.reduce((sum, item) => sum + item.qty, 0);

        const summaryText = state.cart.map((item) => `${item.name} x ${item.qty} — ${formatCurrency(item.price * item.qty)}`).join('\n');
        const totalsText = `Customer: ${customerName}\nItems: ${itemCount}\nSubtotal: ${formatCurrency(total - shipping)}\nDelivery: ${formatCurrency(shipping)}\nTotal: ${formatCurrency(total)}`;

        document.getElementById('orderSummary').value = summaryText;
        document.getElementById('orderTotals').value = totalsText;

        const submitButton = checkoutForm.querySelector('button[type="submit"]');
        const originalText = submitButton.textContent;
        submitButton.disabled = true;
        submitButton.textContent = 'Sending...';

        try {
          const response = await fetch('https://formspree.io/f/mkjnjooa', {
            method: 'POST',
            headers: {
              'Accept': 'application/json'
            },
            body: new FormData(checkoutForm)
          });

          if (!response.ok) {
            throw new Error('Form submission failed');
          }

          localStorage.setItem('steelbox-last-order', JSON.stringify({
            name: customerName,
            total,
            itemCount,
            date: new Date().toISOString()
          }));

          const successUrl = `success.html?name=${encodeURIComponent(customerName)}&items=${encodeURIComponent(itemCount)}&total=${encodeURIComponent(total)}`;

          state.cart = [];
          saveCart();
          updateCart();
          checkoutForm.reset();
          checkoutModal.classList.remove('open');
          window.location.href = successUrl;
        } catch (error) {
          showToast('There was a problem sending your order. Please try again.');
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = originalText;
        }
      });

      renderCatalog();
      updateCart();
    </script>
  </body>
</html>
